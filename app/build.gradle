plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cloudwubi.glasskeyboard'
    compileSdk 33

    defaultConfig {
        applicationId "com.cloudwubi.glasskeyboard"
        minSdk 24
        targetSdk 33
        versionCode 23
        versionName "3.2-lite"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug   // 用 debug 签名出 release（可真机实测、不可上架）
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
